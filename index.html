<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Rutina Nocturna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-6">
        
        <!-- Encabezado y Estado -->
        <header class="text-center py-4 bg-slate-800 rounded-xl shadow-lg border border-slate-700">
            <h1 class="text-xl font-bold text-indigo-400">Mi Rutina & Consultoría</h1>
            <p id="reloj" class="text-2xl font-mono mt-1"></p>
            <div id="mensaje-motivacional" class="mt-3 text-sm italic text-slate-300 px-4"></div>
        </header>

        <!-- Checklist de Hábitos -->
        <section class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h2 class="font-semibold text-lg mb-3 text-emerald-400">Hábitos Diarios</h2>
            <div class="space-y-2">
                <label class="flex items-center space-x-3 bg-slate-700/50 p-2 rounded">
                    <input type="checkbox" class="w-5 h-5 accent-emerald-500">
                    <span>Dormir 7.5 hrs (10:00 AM - 5:30 PM)</span>
                </label>
                <label class="flex items-center space-x-3 bg-slate-700/50 p-2 rounded">
                    <input type="checkbox" class="w-5 h-5 accent-emerald-500">
                    <span>Ejercicio de 30-40 min</span>
                </label>
                <label class="flex items-center space-x-3 bg-slate-700/50 p-2 rounded">
                    <input type="checkbox" class="w-5 h-5 accent-emerald-500">
                    <span>Junta de Consultoría con Hermano</span>
                </label>
                <label class="flex items-center space-x-3 bg-slate-700/50 p-2 rounded">
                    <input type="checkbox" class="w-5 h-5 accent-emerald-500">
                    <span>30 min de Inglés / Lectura</span>
                </label>
                <label class="flex items-center space-x-3 bg-slate-700/50 p-2 rounded">
                    <input type="checkbox" class="w-5 h-5 accent-emerald-500">
                    <span>Corte de cafeína (3:00 AM)</span>
                </label>
            </div>
        </section>

        <!-- Recomendaciones Rápidas -->
        <section class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h2 class="font-semibold text-lg mb-2 text-amber-400">Sugerencia Actual</h2>
            <p id="sugerencia-comida" class="text-sm text-slate-300"></p>
        </section>

    </div>

    <script>
        function actualizarSistema() {
            const ahora = new Date();
            const horas = ahora.getHours();
            const minutos = ahora.getMinutes().toString().padStart(2, '0');
            document.getElementById('reloj').innerText = `${horas}:${minutos}`;

            let mensaje = "";
            let sugerencia = "";

            if (horas >= 9 && horas < 10) {
                mensaje = "😴 ¡Llegaste a casa! Desayuna ligero, desconecta pantallas y descansa.";
                sugerencia = "Comida: Omelette con espinacas o yogur griego con nueces.";
            } else if (horas >= 17 && horas < 19) {
                mensaje = "🏋️‍♀️ ¡Tiempo de activarte! Haz 30 min de ejercicio e hidrátate.";
                sugerencia = "Comida: Pechuga a la plancha con arroz integral y verduras.";
            } else if (horas >= 19 && horas < 21) {
                mensaje = "💼 Modo Empresaria. Revisa avances de la consultoría y repasa tu inglés.";
                sugerencia = "Actividad: Junta de 45 min con tu hermano + 30 min de inglés.";
            } else if (horas >= 3 && horas < 5) {
                mensaje = "🚫☕ Recuerda: Corta la cafeína ahora para garantizar un sueño reparador en la mañana.";
                sugerencia = "Snack: Un puño de almendras y agua fría o té sin teína.";
            } else {
                mensaje = "💪 Cada paso en tu turno te acerca a consolidar tu consultoría.";
                sugerencia = "Mantente hidratada durante el turno.";
            }

            document.getElementById('mensaje-motivacional').innerText = mensaje;
            document.getElementById('sugerencia-comida').innerText = sugerencia;
        }

        setInterval(actualizarSistema, 1000);
        actualizarSistema();
    </script>
</body>
</html>
